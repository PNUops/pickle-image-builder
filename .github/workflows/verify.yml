name: verify

on:
  pull_request:
  push:
    branches: [main]

# The job runs shell that arrives with the pull request: profiles are sourced
# by the gate. Read access is all it needs.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run verification
        run: bash scripts/verify.sh
