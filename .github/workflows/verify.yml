name: verify

on:
  pull_request:
  push:
    branches: [main]

# The gate sources the profiles in the branch, so a pull request runs its own
# shell on the runner. Narrowing the token does not change that; it limits what
# the run can reach if it is abused.
permissions:
  contents: read

# A branch that gets three pushes in a minute ran three full jobs, and the two
# that no longer describe anything were still occupying runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run verification
        run: bash scripts/verify.sh
