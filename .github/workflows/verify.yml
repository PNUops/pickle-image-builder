name: verify

on:
  pull_request:
  push:
    branches: [main]

# The gate sources the profiles in the branch, so a pull request runs its own
# shell on the runner. Narrowing the token does not change that; it limits what
# the run can reach if it is abused.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run verification
        run: bash scripts/verify.sh
