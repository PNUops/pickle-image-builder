name: verify

on:
  pull_request:
  push:
    branches: [main]

# The gate sources the profiles in the branch, so a pull request runs its own
# shell on the runner. Narrowing the token does not change that; it limits what
# the run can reach if it is abused.
permissions:
  contents: read

# A branch that gets three pushes in a minute ran three full jobs, and the two
# that no longer describe anything were still occupying runners. Cancelling is
# right for a branch, where only the newest push is under review, and wrong for
# the default branch, where each run records the state of a commit that is
# already merged and cancelling leaves that commit with no result at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run verification
        run: bash scripts/verify.sh
